<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pdg2pdf-web</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.4rem; }
  .card { border: 1px solid #ddd; border-radius: 10px; padding: 1.25rem; margin: 1rem 0; }
  #drop { border: 2px dashed #aaa; border-radius: 10px; padding: 2rem; text-align: center; color: #666; transition: .15s; }
  #drop.over { border-color: #06c; background: #f0f6ff; color: #06c; }
  button { padding: .5rem 1rem; cursor: pointer; border: 1px solid #ccc; border-radius: 6px; background: #fff; }
  button:hover { background: #f4f4f4; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  td, th { text-align: left; padding: .45rem; border-bottom: 1px solid #eee; font-size: .88rem; vertical-align: top; }
  .queued { color: #a60; } .running { color: #06c; } .done { color: #080; } .error { color: #c00; }
  code { background: #f4f4f4; padding: .1rem .3rem; border-radius: 4px; }
  .errtext { color: #c00; font-size: .8rem; word-break: break-all; }
  .meta { color: #888; font-size: .78rem; }
  .hint { color: #888; font-size: .85rem; }
</style>
</head>
<body>
<h1>pdg2pdf-web</h1>
<p class="hint">Upload an archive (zip / rar / 7z / uvz) containing PDG files and get a PDF back.
   Encrypted archives are tried against the bundled password list.</p>

<div class="card">
  <div id="drop">Drag &amp; drop an archive here, or
    <input type="file" id="file" accept=".zip,.rar,.7z,.uvz,application/zip,application/x-rar-compressed,application/x-7z-compressed">
  </div>
  <p>
    <label class="hint"><input type="checkbox" id="ocr"> OCR text layer (slower, adds selectable/searchable text)</label>
  </p>
  <p><button id="upload">Convert</button> <span id="msg" class="hint"></span></p>
</div>

<table>
  <thead><tr><th>Job</th><th>File</th><th>Status</th><th>Result</th></tr></thead>
  <tbody id="rows"></tbody>
</table>

<script>
const msg = t => document.getElementById('msg').textContent = t;
const drop = document.getElementById('drop');
let pending = null;

drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => {
  e.preventDefault(); drop.classList.remove('over');
  pending = e.dataTransfer.files[0];
  drop.textContent = 'Selected: ' + pending.name;
};

async function refresh() {
  const res = await fetch('/api/jobs');
  const data = await res.json();
  document.getElementById('rows').innerHTML = data.jobs.map(j => {
    const meta = j.meta ? `<div class="meta">${j.meta.archive_format || ''} · ${j.meta.extracted_files || 0} files${j.meta.archive_password_used ? ' · password used' : ''} · via ${j.meta.backend || ''}${j.meta.ocr ? ' · OCR' : ''}</div>` : '';
    const err = j.error ? `<div class="errtext">${j.error}</div>` : '';
    const link = j.status === 'done' ? `<a href="/api/jobs/${j.id}/download">Download PDF</a>` : '';
    return `<tr>
      <td><code>${j.id}</code></td>
      <td>${j.filename}${meta}</td>
      <td class="${j.status}">${j.status}${err}</td>
      <td>${link}</td>
    </tr>`;
  }).join('');
}

async function upload() {
  const f = pending || document.getElementById('file').files[0];
  if (!f) { msg('choose a file first'); return; }
  msg('uploading ' + f.name + ' ...');
  const fd = new FormData();
  fd.append('file', f);
  if (document.getElementById('ocr').checked) fd.append('ocr', '1');
  const res = await fetch('/api/jobs', { method: 'POST', body: fd });
  if (!res.ok) { msg('upload failed: ' + await res.text()); return; }
  msg('queued.');
  pending = null;
  refresh();
}

document.getElementById('upload').onclick = upload;
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
