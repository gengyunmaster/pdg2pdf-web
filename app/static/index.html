<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>pdg2pdf-web</title>
<style>
  :root {
    --bg: #070b14;
    --bg-glow-1: rgba(56, 189, 248, 0.07);
    --bg-glow-2: rgba(129, 140, 248, 0.06);
    --panel: rgba(148, 163, 184, 0.05);
    --panel-strong: rgba(148, 163, 184, 0.09);
    --border: rgba(148, 163, 184, 0.14);
    --border-strong: rgba(148, 163, 184, 0.28);
    --text: #e2e8f0;
    --text-dim: #8b9bb0;
    --text-faint: #5b6b80;
    --accent: #22d3ee;
    --accent-2: #818cf8;
    --ok: #34d399;
    --warn: #fbbf24;
    --err: #f87171;
    --run: #38bdf8;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    color: var(--text);
    background:
      radial-gradient(900px 500px at 15% -10%, var(--bg-glow-2), transparent 60%),
      radial-gradient(800px 420px at 90% 0%, var(--bg-glow-1), transparent 55%),
      linear-gradient(rgba(148,163,184,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148,163,184,0.035) 1px, transparent 1px),
      var(--bg);
    background-size: auto, auto, 42px 42px, 42px 42px, auto;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 880px; margin: 0 auto; padding: 3.2rem 1.25rem 4rem; }

  /* ---- header ---- */
  header { display: flex; align-items: center; gap: 0.9rem; margin-bottom: 2.4rem; }
  .logo {
    width: 44px; height: 44px; border-radius: 12px; flex: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center;
    font-family: var(--mono); font-weight: 700; font-size: 0.72rem; color: #06121f;
    letter-spacing: 0.5px;
    box-shadow: 0 0 24px rgba(34, 211, 238, 0.35), 0 0 2px rgba(34,211,238,.6) inset;
  }
  h1 { font-size: 1.35rem; margin: 0; letter-spacing: 0.3px; }
  .tagline { color: var(--text-dim); font-size: 0.85rem; margin-top: 2px; }
  .tagline code {
    font-family: var(--mono); font-size: 0.78rem;
    color: var(--accent); background: rgba(34,211,238,0.08);
    padding: 1px 6px; border-radius: 5px;
  }

  /* ---- upload card ---- */
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.5rem;
    backdrop-filter: blur(6px);
    transition: border-color .2s, background .2s;
  }
  .card:hover { border-color: var(--border-strong); background: var(--panel-strong); }

  #drop {
    border: 1.5px dashed var(--border-strong);
    border-radius: 12px;
    padding: 2.4rem 1.5rem;
    text-align: center;
    color: var(--text-dim);
    cursor: pointer;
    transition: border-color .18s, box-shadow .18s, transform .18s, background .18s;
  }
  #drop:hover, #drop.over {
    border-color: var(--accent);
    background: rgba(34, 211, 238, 0.05);
    box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.08), 0 0 28px rgba(34,211,238,0.15);
    transform: translateY(-1px);
    color: var(--text);
  }
  #drop .icon {
    width: 40px; height: 40px; margin: 0 auto 0.7rem; display: block;
    color: var(--accent);
  }
  #drop .title { font-size: 0.98rem; color: var(--text); }
  #drop .sub { font-size: 0.8rem; margin-top: 0.3rem; }
  #drop input[type=file] { display: none; }
  #drop .picked { color: var(--ok); font-family: var(--mono); font-size: 0.85rem; }

  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 0.9rem; margin-top: 1.1rem; }
  button.primary {
    border: none; border-radius: 10px; padding: 0.62rem 1.5rem;
    font-size: 0.92rem; font-weight: 600; color: #06121f; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 4px 18px rgba(34, 211, 238, 0.25);
    transition: transform .15s, box-shadow .15s, filter .15s;
  }
  button.primary:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(34,211,238,.38); filter: brightness(1.08); }
  button.primary:active { transform: translateY(0); }

  label.ocr {
    display: inline-flex; align-items: center; gap: 0.5rem;
    font-size: 0.84rem; color: var(--text-dim); cursor: pointer; user-select: none;
  }
  label.ocr:hover { color: var(--text); }
  label.ocr input { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }

  #msg { font-size: 0.82rem; color: var(--text-dim); font-family: var(--mono); }

  /* ---- job list ---- */
  .section-title {
    margin: 2.2rem 0 0.9rem; font-size: 0.78rem; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-faint);
  }
  #rows { display: flex; flex-direction: column; gap: 0.7rem; }
  .job {
    display: flex; align-items: flex-start; gap: 0.9rem;
    background: var(--panel); border: 1px solid var(--border);
    border-left: 3px solid var(--border-strong);
    border-radius: 12px; padding: 0.9rem 1.1rem;
    animation: rise .25s ease both;
    transition: border-color .18s, background .18s;
  }
  .job:hover { background: var(--panel-strong); }
  .job.queued  { border-left-color: var(--warn); }
  .job.running { border-left-color: var(--run); }
  .job.done    { border-left-color: var(--ok); }
  .job.error   { border-left-color: var(--err); }

  .job .body { flex: 1; min-width: 0; }
  .job .name { font-size: 0.92rem; word-break: break-all; }
  .job .meta { font-size: 0.76rem; color: var(--text-faint); margin-top: 0.3rem; font-family: var(--mono); }
  .job .meta b { color: var(--text-dim); font-weight: 500; }
  .job .err {
    margin-top: 0.45rem; font-size: 0.76rem; color: var(--err);
    font-family: var(--mono); word-break: break-all;
    background: rgba(248,113,113,0.07); border: 1px solid rgba(248,113,113,0.18);
    padding: 0.4rem 0.6rem; border-radius: 8px;
  }

  .badge {
    flex: none; display: inline-flex; align-items: center; gap: 0.45rem;
    font-size: 0.75rem; font-weight: 600; letter-spacing: 0.4px;
    padding: 0.28rem 0.75rem; border-radius: 999px;
    border: 1px solid var(--border-strong); color: var(--text-dim);
    background: rgba(148,163,184,0.06);
  }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .job.queued  .badge { color: var(--warn); border-color: rgba(251,191,36,.35); background: rgba(251,191,36,.07); }
  .job.running .badge { color: var(--run);  border-color: rgba(56,189,248,.35); background: rgba(56,189,248,.07); }
  .job.done    .badge { color: var(--ok);   border-color: rgba(52,211,153,.35); background: rgba(52,211,153,.07); }
  .job.error   .badge { color: var(--err);  border-color: rgba(248,113,113,.35); background: rgba(248,113,113,.07); }
  .job.running .badge .dot { animation: pulse 1.1s ease-in-out infinite; }

  a.dl {
    flex: none; font-size: 0.82rem; font-weight: 600; text-decoration: none;
    color: var(--accent); border: 1px solid rgba(34,211,238,0.35);
    padding: 0.32rem 0.85rem; border-radius: 8px;
    transition: background .15s, box-shadow .15s;
  }
  a.dl:hover { background: rgba(34,211,238,0.1); box-shadow: 0 0 16px rgba(34,211,238,0.2); }

  .empty { text-align: center; color: var(--text-faint); padding: 2.2rem 0; font-size: 0.86rem; }

  footer { margin-top: 3rem; text-align: center; font-size: 0.75rem; color: var(--text-faint); }
  footer .mono { font-family: var(--mono); }

  @keyframes pulse { 0%,100% { opacity: 1; box-shadow: 0 0 0 0 rgba(56,189,248,.5);} 50% { opacity: .55; box-shadow: 0 0 0 4px rgba(56,189,248,0);} }
  @keyframes rise { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: none;} }

  @media (max-width: 560px) {
    .job { flex-wrap: wrap; }
    .job .body { flex-basis: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">P2P</div>
    <div>
      <h1>pdg2pdf-web</h1>
      <div class="tagline">Self-hosted <code>PDG e-book</code> → <code>PDF</code> conversion</div>
    </div>
  </header>

  <div class="card">
    <div id="drop" role="button" tabindex="0">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 16V4m0 0l-4 4m4-4l4 4"/>
        <path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3"/>
      </svg>
      <div class="title">Drop a book archive here</div>
      <div class="sub">or click to browse — zip · rar · 7z · uvz</div>
      <input type="file" id="file" accept=".zip,.rar,.7z,.uvz,application/zip,application/x-rar-compressed,application/x-7z-compressed">
    </div>

    <div class="controls">
      <button id="upload" class="primary">Convert</button>
      <label class="ocr"><input type="checkbox" id="ocr"> OCR text layer <span style="color:var(--text-faint)">(slower, adds searchable text)</span></label>
      <span id="msg"></span>
    </div>
  </div>

  <div class="section-title">Conversions</div>
  <div id="rows"></div>

  <footer>
    Results are kept for <span class="mono">24 h</span> · auto-fallback to the
    reference wrapper for encrypted books · <span class="mono">pdg2pdf-web</span>
  </footer>
</div>

<script>
const msg = t => document.getElementById('msg').textContent = t;
const drop = document.getElementById('drop');
let pending = null;

drop.onclick = () => document.getElementById('file').click();
drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') drop.click(); };
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => {
  e.preventDefault(); drop.classList.remove('over');
  pending = e.dataTransfer.files[0];
  if (pending) drop.querySelector('.sub').innerHTML =
    `<span class="picked">${pending.name} · ${(pending.size/1048576).toFixed(1)} MB</span>`;
};
document.getElementById('file').onchange = () => {
  pending = document.getElementById('file').files[0];
  if (pending) drop.querySelector('.sub').innerHTML =
    `<span class="picked">${pending.name} · ${(pending.size/1048576).toFixed(1)} MB</span>`;
};

const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function refresh() {
  const res = await fetch('/api/jobs');
  const data = await res.json();
  const rows = document.getElementById('rows');
  if (!data.jobs.length) {
    rows.innerHTML = '<div class="empty">No conversions yet — drop a book archive above.</div>';
    return;
  }
  rows.innerHTML = data.jobs.map(j => {
    const meta = j.meta ? `<div class="meta">${j.meta.archive_format || ''} · ${j.meta.extracted_files || 0} files${j.meta.archive_password_used ? ' · password used' : ''} · ${j.meta.backend || ''}${j.meta.ocr ? ' · OCR' : ''}</div>` : '';
    const err = j.error ? `<div class="err">${esc(j.error)}</div>` : '';
    const dl = j.status === 'done' ? `<a class="dl" href="/api/jobs/${j.id}/download">Download PDF</a>` : '';
    return `<div class="job ${j.status}">
      <div class="body">
        <div class="name">${esc(j.filename)}</div>
        ${meta}${err}
      </div>
      <span class="badge"><span class="dot"></span>${j.status}</span>
      ${dl}
    </div>`;
  }).join('');
}

async function upload() {
  const f = pending || document.getElementById('file').files[0];
  if (!f) { msg('choose a file first'); return; }
  msg('uploading ' + f.name + ' …');
  const fd = new FormData();
  fd.append('file', f);
  if (document.getElementById('ocr').checked) fd.append('ocr', '1');
  const res = await fetch('/api/jobs', { method: 'POST', body: fd });
  if (!res.ok) { msg('upload failed: ' + await res.text()); return; }
  msg('queued.');
  pending = null;
  drop.querySelector('.sub').textContent = 'or click to browse — zip · rar · 7z · uvz';
  refresh();
}

document.getElementById('upload').onclick = upload;
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
