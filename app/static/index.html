<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pdg2pdf-web</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.4rem; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
  button { padding: .5rem 1rem; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  td, th { text-align: left; padding: .4rem; border-bottom: 1px solid #eee; font-size: .9rem; }
  .queued { color: #a60; } .running { color: #06c; } .done { color: #080; } .error { color: #c00; }
  code { background: #f4f4f4; padding: .1rem .3rem; border-radius: 4px; }
</style>
</head>
<body>
<h1>pdg2pdf-web</h1>
<p>Upload an archive (zip / rar / 7z / uvz) containing PDG files. You will get a PDF.</p>

<div class="card">
  <input type="file" id="file" accept=".zip,.rar,.7z,.uvz,application/zip,application/x-rar-compressed,application/x-7z-compressed">
  <button id="upload">Convert</button>
  <span id="msg"></span>
</div>

<table>
  <thead><tr><th>Job</th><th>File</th><th>Status</th><th>Result</th></tr></thead>
  <tbody id="rows"></tbody>
</table>

<script>
const msg = (t) => document.getElementById('msg').textContent = t;

async function refresh() {
  const res = await fetch('/api/jobs');
  const data = await res.json();
  document.getElementById('rows').innerHTML = data.jobs.map(j => `
    <tr>
      <td><code>${j.id}</code></td>
      <td>${j.filename}</td>
      <td class="${j.status}">${j.status}${j.error ? ' — ' + j.error : ''}</td>
      <td>${j.status === 'done' ? `<a href="/api/jobs/${j.id}/download">Download PDF</a>` : ''}</td>
    </tr>`).join('');
}

document.getElementById('upload').onclick = async () => {
  const f = document.getElementById('file').files[0];
  if (!f) { msg('choose a file first'); return; }
  msg('uploading…');
  const fd = new FormData();
  fd.append('file', f);
  const res = await fetch('/api/jobs', { method: 'POST', body: fd });
  if (!res.ok) { msg('upload failed: ' + (await res.text())); return; }
  msg('queued.');
  refresh();
};

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
