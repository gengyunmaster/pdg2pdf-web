[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdg2pdf-web"
version = "0.1.0"
description = "Convert PDG e-books to PDF via a self-hosted web service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.license]
text = "Apache-2.0"

[tool.setuptools.packages.find]
include = ["app*"]
